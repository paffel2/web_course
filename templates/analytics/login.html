{% extends "base.html" %}

{% block title %}Авторизация в системе | Аналитика автозапчастей{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="bi bi-shield-lock-fill fs-1 d-block mb-2 text-warning"></i>
                <h4 class="fw-bold mb-0">Вход в систему</h4>
                <small class="text-white-50">Аналитика рекламных кампаний</small>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label small fw-semibold text-muted">Имя пользователя (Логин):</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" id="id_username" required placeholder="Введите логин" autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label small fw-semibold text-muted">Пароль:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" id="id_password" required placeholder="Введите пароль">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        Войти в систему
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
